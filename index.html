<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="An interactive globe of famous landmarks for curious kids." />
  <title>World Adventures!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=skysun" />
  <link rel="stylesheet" href="toy.css?v=skysun" />
</head>
<body class="deep-space">
  <div class="sky" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div id="stars" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>
  <canvas class="fireflies" id="fireflies" aria-hidden="true"></canvas>

  <div class="loader" id="loader">
    <div class="loader-orb" aria-hidden="true"></div>
    <p>Spinning up your world…</p>
  </div>

  <header class="topbar">
    <div class="brand">
      <h1>World Adventures!</h1>
      <span id="brandHint"></span>
    </div>
    <div class="controls">
      <button type="button" class="btn icon-only" id="muteBtn" aria-pressed="false" title="Sound" aria-label="Sound on">
        <span class="icon" id="muteIcon" aria-hidden="true">🔊</span>
      </button>
      <button type="button" class="btn icon-only" id="sunBtn" title="Drag the sun" aria-label="Drag the sun">
        <span class="icon" aria-hidden="true">☀️</span>
      </button>
      <button type="button" class="btn icon-only" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel" title="Settings" aria-label="Settings">
        <span class="icon" aria-hidden="true">⚙️</span>
      </button>
      <div class="find-wrap">
        <button type="button" class="btn icon-only" id="findBtn" title="Find" aria-label="Find this place">
          <span class="icon" aria-hidden="true">🔍</span>
        </button>
        <button type="button" class="find-badge" id="stickersBtn" hidden title="Stickers" aria-label="Your stickers">
          <span aria-hidden="true">🌟</span>
          <span class="sticker-count" id="stickerCount">0</span>
        </button>
      </div>
      <button type="button" class="btn primary icon-only" id="surpriseBtn" title="Surprise" aria-label="Surprise me">
        <span class="icon" id="surpriseIcon" aria-hidden="true">🎲</span>
      </button>
    </div>
    <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Settings">
      <button type="button" class="btn night-btn" id="nightBtn" aria-pressed="false" title="Night lights">
        <span class="icon" id="nightIcon">🌙</span>
        <span>Night lights</span>
      </button>
      <button type="button" class="btn" id="autoNightBtn" aria-pressed="true" title="Auto night from clock">
        <span class="icon" aria-hidden="true">🕐</span>
        <span id="autoNightLabel">Auto night on</span>
      </button>
    </div>
  </header>

  <nav class="mode-dock" id="adventureNav" role="tablist" aria-label="Pick an adventure">
    <button type="button" class="mode-tab active" role="tab" id="tabLandmarks" aria-selected="true" data-tab="landmarks" title="Landmarks" aria-label="Landmarks">
      <span class="mode-emoji" aria-hidden="true">🏛️</span>
      <span class="mode-label">Landmarks</span>
    </button>
    <button type="button" class="mode-tab" role="tab" id="tabWonders" aria-selected="false" data-tab="wonders" title="Natural wonders" aria-label="Natural wonders">
      <span class="mode-emoji" aria-hidden="true">🌋</span>
      <span class="mode-label">Wonders</span>
    </button>
    <button type="button" class="mode-tab" role="tab" id="tabContinents" aria-selected="false" data-tab="continents" title="Continents" aria-label="Continents">
      <span class="mode-emoji" aria-hidden="true">🌍</span>
      <span class="mode-label">Continents</span>
    </button>
    <button type="button" class="mode-tab" role="tab" id="tabCountries" aria-selected="false" data-tab="countries" title="Countries" aria-label="Countries">
      <span class="mode-emoji" aria-hidden="true">🚩</span>
      <span class="mode-label">Countries</span>
    </button>
    <button type="button" class="mode-tab" role="tab" id="tabSpace" aria-selected="false" data-tab="space" title="Space" aria-label="Space">
      <span class="mode-emoji" aria-hidden="true">🚀</span>
      <span class="mode-label">Space</span>
    </button>
  </nav>

  <div class="stage">
    <div id="globeViz" role="application" aria-label="Interactive Earth"></div>
    <div class="globe-shadow" id="globeShadow" aria-hidden="true"></div>
    <div class="found-flash" id="foundFlash" aria-hidden="true"></div>
    <div class="space-handoff" id="spaceHandoff" aria-hidden="true"></div>
    <div id="solarSystem" aria-label="Interactive solar system" hidden>
      <div class="ss-views">
        <div class="ss-view active" id="ssViewIso" data-view="spheres">
          <div id="ss3d" class="ss-3d" role="application" aria-label="3D solar system"></div>
          <aside class="ss-sizes open" id="ssSizesPanel" aria-label="Planet sizes">
            <button type="button" class="ss-sizes-toggle" id="ssSizesToggle" aria-expanded="true" aria-controls="ssSizesPanel" title="Sizes" aria-label="Show or hide planet sizes">
              <span class="ss-sizes-toggle-emoji" aria-hidden="true">📏</span>
            </button>
            <div class="ss-sizes-body">
              <p class="ss-sizes-note" id="ssSizesNote">Real sizes · Sun shown smaller</p>
              <div class="ss-sizes-row" id="ssSizesRow"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
    <div class="guide" id="guide">
      <div class="find-prompt" id="findPrompt" hidden>
        <button type="button" class="find-exit" id="findExit" aria-label="Stop finding">×</button>
        <p class="find-cue" id="findCue">Find this!</p>
        <div class="find-stars" id="findStars" aria-hidden="true"></div>
        <div class="find-emoji" id="findEmoji" aria-hidden="true"></div>
        <img class="find-photo" id="findPhoto" alt="" hidden />
        <div class="find-actions">
          <button type="button" class="btn icon-only" id="findHear" title="Hear name" aria-label="Hear the name">
            <span class="icon" aria-hidden="true">🔊</span>
          </button>
          <button type="button" class="btn primary icon-only" id="findAgain" title="Again" aria-label="Find another" hidden>
            <span class="icon" aria-hidden="true">🔁</span>
          </button>
        </div>
      </div>
      <button type="button" class="luna" id="luna" data-mood="idle" aria-label="Luna, start a find">
        <span class="luna-bubble" id="lunaBubble" aria-hidden="true">🌙</span>
        <svg class="luna-svg" viewBox="0 0 160 176" aria-hidden="true">
          <defs>
            <radialGradient id="lunaGlow" cx="40%" cy="32%" r="70%">
              <stop offset="0%" stop-color="#fff6c8"/>
              <stop offset="55%" stop-color="#ffd36a"/>
              <stop offset="100%" stop-color="#e0912a"/>
            </radialGradient>
          </defs>
          <ellipse class="luna-helm" cx="80" cy="78" rx="62" ry="64" fill="none" stroke="#7ec8ff" stroke-width="6" opacity="0.85"/>
          <path class="luna-scarf-back" d="M48 118 C28 148 18 168 38 170 C58 160 70 138 78 122" fill="#ff4d3a"/>
          <circle cx="80" cy="78" r="54" fill="url(#lunaGlow)"/>
          <circle cx="52" cy="58" r="10" fill="#f0c45a" opacity="0.45"/>
          <circle cx="108" cy="92" r="7" fill="#e8a83a" opacity="0.4"/>
          <circle cx="70" cy="100" r="5" fill="#f0c45a" opacity="0.35"/>
          <circle class="luna-blush" cx="48" cy="92" r="8" fill="#ff8a7a" opacity="0.7"/>
          <circle class="luna-blush" cx="112" cy="92" r="8" fill="#ff8a7a" opacity="0.7"/>
          <g class="luna-eyes">
            <ellipse class="luna-eye" cx="60" cy="74" rx="8" ry="10" fill="#1c1208"/>
            <ellipse class="luna-eye" cx="100" cy="74" rx="8" ry="10" fill="#1c1208"/>
            <circle cx="63" cy="71" r="2.4" fill="#fff"/>
            <circle cx="103" cy="71" r="2.4" fill="#fff"/>
          </g>
          <path class="luna-smile" d="M64 98 Q80 112 96 98" fill="none" stroke="#1c1208" stroke-width="3.5" stroke-linecap="round"/>
          <path class="luna-scarf" d="M50 112 Q80 128 112 110 Q118 132 80 142 Q44 132 50 112Z" fill="#ff4d3a"/>
          <path d="M86 138 Q104 150 98 168 Q84 158 80 144" fill="#c73828"/>
          <circle cx="80" cy="124" r="6" fill="#f0d078" stroke="#8a5a12" stroke-width="2"/>
        </svg>
      </button>
    </div>
  </div>

  <section class="explore" aria-label="Place shortcuts">
    <div class="explore-label" id="exploreLabel">🏛️ Landmarks</div>
    <div class="strip" id="strip"></div>
  </section>

  <div class="sticker-sheet" id="stickerSheet" hidden>
    <button type="button" class="sticker-close" id="stickerClose" aria-label="Close stickers">×</button>
    <p class="sticker-cue" aria-hidden="true">🌟</p>
    <div class="sticker-grid" id="stickerGrid"></div>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle" hidden>
    <div class="card-handle" aria-hidden="true"></div>
    <button type="button" class="card-close" id="cardClose" aria-label="Close">×</button>
    <div class="card-scroll" id="cardScroll">
      <div class="card-hero" id="cardHero">
        <span class="photo-hint" id="photoHint">Swipe photos</span>
        <div class="photo-track" id="photoTrack" aria-label="Landmark photos"></div>
        <button type="button" class="photo-nav prev" id="photoPrev" aria-label="Previous photo">‹</button>
        <button type="button" class="photo-nav next" id="photoNext" aria-label="Next photo">›</button>
        <div class="photo-dots" id="photoDots" role="tablist" aria-label="Photo pages"></div>
      </div>
      <p class="photo-credit" id="photoCredit">Photos: Wikimedia Commons</p>
      <div class="card-body">
        <h2 id="cardTitle">Landmark</h2>
        <p class="card-place" id="cardPlace">Place</p>
        <div class="card-story-block" id="cardStoryBlock">
          <p class="card-story" id="cardStory">Story</p>
          <div class="wow">
            <strong>Wow fact</strong>
            <span id="cardWow">Fun detail</span>
          </div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn hear" id="speakBtn">
        <span class="icon">🔊</span> Hear it
      </button>
      <button type="button" class="btn watch" id="watchBtn" aria-pressed="false" hidden>
        <span class="icon">🎬</span> Watch
      </button>
      <button type="button" class="btn anthem" id="anthemBtn" aria-pressed="false" hidden>
        <span class="icon">🎵</span> Anthem
      </button>
      <button type="button" class="btn ghost" id="showPlacesBtn" hidden>
        <span class="icon">✨</span> Explore here
      </button>
      <button type="button" class="btn ghost" id="cardMoreBtn" aria-expanded="false" aria-controls="cardMore">
        More
      </button>
    </div>
    <div class="card-more" id="cardMore"></div>
    <div class="video-panel" id="videoPanel" hidden>
      <button type="button" class="video-placeholder" id="videoStart" aria-label="Play video">
        <span class="play">▶</span>
        <span>Tap to watch</span>
      </button>
      <div class="video-fallback" id="videoFallback">
        <p>Video can’t play right now (needs internet).</p>
        <button type="button" class="btn hear" id="videoFallbackHear">
          <span class="icon">🔊</span> Hear the story instead
        </button>
      </div>
      <p class="video-note" id="videoNote">Video needs internet · YouTube</p>
    </div>
  </article>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
  <script src="vendor/globe.gl.min.js"></script>
  <script src="landmarks.js"></script>
  <script src="wonders.js"></script>
  <script src="geography.js"></script>
  <script type="module" src="boot.js?v=spacez"></script>
</body>
</html>
